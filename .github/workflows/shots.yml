name: Capture project screenshots

# Run by hand from the Actions tab. It re-captures every live project and
# overwrites the images in public/shots.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/shots.mjs
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/shots
          git diff --cached --quiet || git commit -m "Update project screenshots"
          git push
